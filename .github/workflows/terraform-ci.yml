name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.9.8

jobs:
  validate:
    name: fmt, validate e test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (sem backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - name: terraform test (provider simulado)
        run: terraform test

  user-data:
    name: user-data em Amazon Linux 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rodar os scripts do Nagios e dos agentes num container
        run: bash tests/user-data.sh
